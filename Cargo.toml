[workspace]
resolver = "2"
members = [
    "bin/bootnode",    
    "bin/node",
    "crates/peyk",    
]
[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/peeleh/gozara"
keywords = []
categories = []

[workspace.dependencies]

# workspace 
peyk = { path = "crates/peyk" }

# misc
#anyhow = "1.0.95"
#async-channel = "2.3.1"
#async-scoped = "0.9.0"
async-trait = "0.1.85"
axum = "0.8.4"
backoff = "0.4.0"
bincode = "1.3.3"
bytes = "1.10.1"
chrono = { version = "0.4.40", features = ["alloc", "now"] }
clap = { version = "4.4", features = ["derive", "env"] }
config = "0.14.0"
ctrlc = { version = "3.4.5", features = ["termination"] }
dashmap = "6.1.0"
#deadpool-redis = "0.22.0"
dirs = "6.0.0"
dotenv = "0.15.0"
eyre = "0.6.12"
#flate2 = "1.1.4"
futures = "0.3.31"
#hashbrown = "0.15.3"
hex = "0.4.3"
#http = "1.3.1"
#if-addrs = "0.13.4"
#jemallocator = "0.5.4"
lazy_static = "1.5.0"
log = "0.4.27"
lru = "0.14.0"
mti = "1.0.7-beta.1"
opentelemetry = "0.23.0"
opentelemetry-appender-tracing = "0.4.0"
opentelemetry-otlp = "0.16.0"
opentelemetry_sdk = "0.23.0"
# prost = "0.13.5"
rand = "0.9.0"
reqwest = "0.12.12"
#rustix = { version = "0.38", features = ["fs"] }
#rustls = { version = "0.23.27", features = ["ring"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
#sqlx = { version = "0.8.5", features = ["runtime-tokio", "tls-native-tls", "macros", "postgres", "time"] }
sys-info = "0.9.1"
sysinfo = "0.33.1"
tar = "0.4.44"
testcontainers = "0.27.3"
time = { version = "0.3.41", features = ["serde"] }
tokio = { version = "1.45.0", features = ["full", "tracing", "rt-multi-thread"] }
tokio-blocked = "0.1.0"
tokio-stream = "0.1"
tokio-util = "0.7.18"
tonic = { version = "0.12.3", features = ["tls"] }
tonic-build = "0.12.3"
#tonic-web = "0.12.3"
#tower = "0.5.2"
tracing = "0.1.41"
tracing-opentelemetry = "0.24.0"
tracing-subscriber = "0.3.19"
zstd = "0.13.3"
libp2p = { version = "0.56", features = ["tokio", "request-response", "cbor", "gossipsub", "mdns", "kad", "dns", "quic", "identify", "noise", "macros", "tcp", "yamux", "serde", "rsa"] }
libp2p-quic = { version = "0.13", features = ["tokio"] }
blake3 = "1.8.7"
rs_merkle = "1.5.0"



# [workspace.metadata.cargo-shear]
# ignored = ["prost", "serde"]

[profile.release]
debug = true

[profile.release.build-override]
opt-level = 3

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.build-override]
opt-level = 3